name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  fast-ci:
    name: Fast CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy app

      - name: Run non-database tests
        run: |
          python -m pytest \
            --ignore=tests/integration/database

  full-database-ci:
    name: Full PostgreSQL + pgvector CI
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oiap_test
          POSTGRES_PASSWORD: oiap_test
          POSTGRES_DB: oiap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oiap_test -d oiap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://oiap_test:oiap_test@localhost:5432/oiap_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run full test suite
        run: python -m pytest