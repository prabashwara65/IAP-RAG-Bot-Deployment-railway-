[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
